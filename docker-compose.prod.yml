services:
  postgres:
    image: postgres:16-alpine
    container_name: nucleo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - nucleo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${DOCKERHUB_USERNAME}/nucleo-ei-ufp:latest
    container_name: nucleo-app
    init: true  # o processo principal (PID 1) ignora o SIGTERM; o init reencaminha-o
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      ADMIN_PASS: ${ADMIN_PASS:?defina ADMIN_PASS no .env}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    # Espera que o Postgres aceite ligações antes de arrancar. O depends_on só
    # é respeitado pelo "docker compose up"; quando o daemon do Docker reinicia
    # os contentores (restart: always) ignora-o e a app arrancava sem BD.
    command: ["sh", "-c", "until nc -z postgres 5432; do echo 'À espera do Postgres...'; sleep 2; done; exec node server.js"]
    ports:
      - "127.0.0.1:8892:3000"
    networks:
      - nucleo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=nucleo"

  watchtower:
    image: nickfedor/watchtower:1
    container_name: nucleo-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_SCOPE=nucleo
    labels:
      - "com.centurylinklabs.watchtower.scope=nucleo"
    networks:
      - nucleo-network

networks:
  nucleo-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local